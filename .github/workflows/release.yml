name: release

# Сборка релиза по тегу вида v1.0.0. Отдельный раннер на архитектуру: колёса
# Pillow и lz4 под universal2 собираются болезненно, поэтому проще выпустить
# по файлу на платформу, а нужный выбирает install.sh / install.ps1.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15          # Apple Silicon
            arch: arm64
            asset: deru-macos-arm64
          - runner: macos-15-intel    # Intel
            arch: x86_64
            asset: deru-macos-x86_64
          - runner: windows-latest
            arch: x86_64
            asset: deru-windows-x86_64.exe
    runs-on: ${{ matrix.runner }}
    # Раннер, которого больше нет (так ушёл macos-13), не падает — он молча
    # ждёт свободную машину сутки, и release из-за needs не стартует вовсе.
    timeout-minutes: 30
    # На windows-latest run: по умолчанию уходит в pwsh, где ${VAR#v} и ./dist/deru
    # не работают. Шаги писались под bash — он есть на всех трёх раннерах.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements-dev.txt

      - name: Версия в коде совпадает с тегом
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          code="$(python -c 'import sys; sys.path.insert(0, "lib"); from version import VERSION; print(VERSION)')"
          if [ "$tag" != "$code" ]; then
            echo "тег $tag не совпадает с lib/version.py ($code)" >&2
            exit 1
          fi

      - run: pytest -q

      - run: pyinstaller --clean --noconfirm build/deru.spec

      - name: Подпись ad-hoc
        # без подписи macOS на Apple Silicon убивает процесс при запуске
        if: runner.os != 'Windows'
        run: codesign --force --sign - dist/deru

      - name: Проверка запуска
        run: ./dist/deru --version
        # PyInstaller на Windows кладёт рядом deru.exe; bash-обёртка GH его найдёт

      - run: mv dist/deru${{ runner.os == 'Windows' && '.exe' || '' }} dist/${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          retention-days: 7

  release:
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # artifact-архив не хранит права, а .dmg и install.sh ждут исполняемый файл
      - run: chmod +x dist/deru-macos-*

      - name: Собрать .dmg
        run: build/make_dmg.sh dist/deru-macos-arm64 dist/deru-macos-x86_64 dist/DesktopExplorerRU.dmg

      - name: Контрольные суммы
        run: cd dist && shasum -a 256 deru-macos-arm64 deru-macos-x86_64 deru-windows-x86_64.exe DesktopExplorerRU.dmg > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          # Не черновик: releases/latest/download черновики не отдаёт, и
          # установщики получали бы 404 до ручного нажатия Publish.
          draft: false
          files: |
            dist/deru-macos-arm64
            dist/deru-macos-x86_64
            dist/deru-windows-x86_64.exe
            dist/DesktopExplorerRU.dmg
            dist/SHA256SUMS
